<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>ユーザーリスト</title>
  <link rel="stylesheet" th:href="@{/css/global.css}" />
  <script defer th:src="@{/js/script.js}"></script>
</head>
<body>
	<div class="layout--narrow">
        <div th:replace="fragment/common :: header"></div>

		<main class="main">

			<!-- 入力エリア -->			
			<section class="form">
				<h2 class="form__title">スキル編集</h2>

				<div id="errorMessageSkill" class="errorMessage"></div>

				<!-- スキル -->
				<div class="form__group">

					<div class="form__field">
						<label for="skillNameInput" class="form__label">スキル名</label>
						<input th:value="${skill.name}" type="text" id="skillNameInput" class="text-box text-box--md" placeholder="スキル名" autofocus>
					</div>

					<div class="form__actions">
						<button id="updateSkillButton" th:data-skill-id="${skill.id}" class="btn btn--md btn-positive">更新</button>
					</div>
				</div>
		    </section>
        </main>
    </div>
</body>
