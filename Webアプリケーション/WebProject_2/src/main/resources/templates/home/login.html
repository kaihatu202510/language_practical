<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーリスト</title>
  <link rel="stylesheet" th:href="@{/css/global.css}" />
  <script defer th:src="@{/js/script.js}"></script>
</head>
<body>
	<div class="layout--narrow">
		<div th:replace="fragment/common :: header"></div>
		
		<div class="main">
			
			<div th:if="${param.error}" class="Message">
				ユーザー名とパスワードが無効です
			</div>
			
			<form th:action="@{/login}" method="post" class="form">
				<h2 class="form__title">ログイン</h2>
				<div class="form__group">
					
					<div class="form__field">
						<label for="username">ユーザー名:</label>
						<input type="text" id="username" name="username" class="text-box text-box--md" required autofocus/>
					</div>
					
					<div class="form__field">
						<label for="password">パスワード:</label>
						<input type="password" id="password" name="password" class="text-box text-box--md" required/>
					</div>
					
					<div class="form__actions">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
						<button type="submit" class="btn btn--md btn-positive">ログイン</button>
					</div>
			</form>
		</div>
	</div>
</body>
</html>
