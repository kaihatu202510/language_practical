<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーリスト</title>
  <link rel="stylesheet" href="../css/global.css" />
  <script defer src="../js/script.js"></script>
</head>
<body>
	<div class="layout--narrow">
        <header id="header" class="header"></header>

		<main class="main">
			<section class="form">
				<h2 class="form__title">ユーザー登録</h2>

				<div class="form__group">
					<div class="form__field">
						<label for="userNameInput" class="form__label">名前</label>
						<input type="text" id="userNameInput" class="text-box text-box--md" placeholder="名前を入力">
					</div>
					<div class="form__actions">
						<button id="createUserButton" class="btn btn--md btn-positive">ユーザー登録</button>
					</div>
				</div>
            </section>
        </main>
    </div>
</body>
