<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーリスト</title>
  <link rel="stylesheet" href="../css/global.css" />
  <script defer src="../js/script.js"></script>
</head>
<body>
	<div class="layout">
		<header id="header" class="header"></header>

		<main class="main">			
			<section class="display__block">
				<div class="display__inputs">			
					<input type="text" id="userNameFilter" class="text-box" placeholder="正規表現で絞り込み">				
				</div>

				<div class="display__actions">
					<button id="getUsersButton" class="btn btn--sm btn-positive">ユーザー一覧取得</button>
				</div>

				<table class="display__list display__list--users">
					<thead class="list-row--header">
						<tr class="list-row">
							<th>ID</th>
							<th>ユーザー名</th>
							<th></th>
							<th></th>
						</tr>
					</thead>
					<tbody id="userTableBody">
						<tr class="list-row"></tr>
					</tbody>
				</table>
			</section>
		</main>
	</div>
	
</body>
</html>
